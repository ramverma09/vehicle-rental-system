name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ghcr.io/ramverma09/vehicle-rental-backend:latest \
            ./backend

      - name: Build Frontend
        run: |
          docker build \
            -t ghcr.io/ramverma09/vehicle-rental-frontend:latest \
            ./frontend

      - name: Push Backend
        run: |
          docker push ghcr.io/ramverma09/vehicle-rental-backend:latest

      - name: Push Frontend
        run: |
          docker push ghcr.io/ramverma09/vehicle-rental-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/vehicle-rental

            docker compose pull

            docker compose up -d

            docker image prune -f

name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ghcr.io/ramverma09/vehicle-rental-backend:latest \
            ./backend

      - name: Build Frontend
        run: |
          docker build \
            -t ghcr.io/ramverma09/vehicle-rental-frontend:latest \
            ./frontend

      - name: Push Backend
        run: |
          docker push ghcr.io/ramverma09/vehicle-rental-backend:latest

      - name: Push Frontend
        run: |
          docker push ghcr.io/ramverma09/vehicle-rental-frontend:latest

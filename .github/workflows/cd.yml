name: Deploy Vehicle Rental

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Pull latest images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/vehicle-rental-backend:latest
          docker pull ghcr.io/${{ github.repository_owner }}/vehicle-rental-frontend:latest

      - name: Stop old containers
        run: |
          docker stop vehicle-rental-backend || true
          docker stop vehicle-rental-frontend || true
          docker rm vehicle-rental-backend || true
          docker rm vehicle-rental-frontend || true

      - name: Start backend
        run: |
          docker run -d \
            --name vehicle-rental-backend \
            -p 5001:5001 \
            --env-file ~/Desktop/vehicle-rental-system/backend/.env \
            ghcr.io/${{ github.repository_owner }}/vehicle-rental-backend:latest

      - name: Start frontend
        run: |
          docker run -d \
            --name vehicle-rental-frontend \
            -p 5173:80 \
            ghcr.io/${{ github.repository_owner }}/vehicle-rental-frontend:latest
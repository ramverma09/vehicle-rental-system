services:

  backend:
    build: ./backend
    container_name: vehicle-rental-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vehicle-rental-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped